name: Foundation CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    name: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: UI browser regressions when UI module is present
        if: ${{ hashFiles('tests/ui/browser/playwright.ui.config.ts') != '' }}
        run: node node_modules/@playwright/test/cli.js test -c tests/ui/browser/playwright.ui.config.ts
      - name: Real engine and UI journeys when both modules are present
        if: ${{ hashFiles('src/engine/index.ts') != '' && hashFiles('src/screens/index.ts') != '' }}
        run: npm run test:integration -- journey.spec.ts
