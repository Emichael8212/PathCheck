<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PathCheck mockup: Start</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { render } from './view.js';
      document.getElementById('app').innerHTML = render('start');
      const { setupDemo } = await import('./behavior.js');
      setupDemo(document.querySelector('[data-demo]'), { reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches });
    </script>
  </body>
</html>
